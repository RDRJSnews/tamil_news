name: Run News Bot

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:  # Allows manual triggering

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium
        sudo apt-get install xvfb -y  # Required for GUI in CI
        
    - name: Run News Bot (Visible Browser)
      env:
        NEWS_BOT_EMAIL: ${{ secrets.NEWS_BOT_EMAIL }}
        NEWS_BOT_PASSWORD: ${{ secrets.NEWS_BOT_PASSWORD }}
        DISPLAY: ':99'  # Required for xvfb
      run: |
        # Start virtual display and run script
        Xvfb :99 -screen 0 1280x1024x24 &
        python chatgpt_git.py  # Make sure your script sets headless=False!
