name: Tamil News Automation

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      language:
        description: 'Language for news generation'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - en-in
          - ta
          - hi
      retry_on_failure:
        description: 'Retry on failure (up to 3 times)'
        required: false
        default: true
        type: boolean
  # schedule:
  #   - cron: '30 0 * * *'   # 6:00 AM IST (00:30 UTC)
  #   - cron: '30 12 * * *'  # 6:00 PM IST (12:30 UTC)
  schedule:
  - cron: '34 8 * * *'  # 1:34 PM IST (08:34 UTC)

jobs:
  run-news:
    runs-on: ubuntu-latest
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: 1  # Ensure Python output is not buffered

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Google credentials
        env:
          CLIENT_JSON: ${{ secrets.CLIENT_JSON }}
        run: |
          echo "$CLIENT_JSON" > client.json
          echo "Google credentials file created"

      - name: Download YouTube token (if exists)
        uses: actions/download-artifact@v4
        with:
          name: youtube-token
          path: ./
        continue-on-error: true

      - name: Run Tamil news workflow
        if: ${{ github.event.inputs.language == 'all' || github.event.inputs.language == 'ta' }}
        run: |
          echo "Running news_video.py for Tamil"
          python news_video.py --lang ta

      - name: Run English news workflow
        if: ${{ github.event.inputs.language == 'all' || github.event.inputs.language == 'en-in' }}
        run: |
          echo "Running news_video.py for English"
          python news_video.py --lang en-in

      - name: Run Hindi news workflow
        if: ${{ github.event.inputs.language == 'all' || github.event.inputs.language == 'hi' }}
        run: |
          echo "Running news_video.py for Hindi"
          python news_video.py --lang hi

      - name: List files in workspace
        run: ls -lR

      - name: Upload YouTube token (if generated)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: youtube-token
          path: youtube_token.pickle
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Tamil News workflow completed successfully!"
          echo "📅 Run time: $(date)"
          echo "🔗 Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Tamil News workflow failed!"
          echo "📅 Run time: $(date)"
          echo "🔗 Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "📋 Check the logs artifact for detailed error information"

      - name: Clean up temporary files
        if: always()
        run: |
          rm -f client.json
          rm -f youtube_token.pickle
          rm -f *.wav
          rm -f "output_video*.mp4"
          echo "Cleanup completed" 
