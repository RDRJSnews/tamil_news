name: Tamil News Automation

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      language:
        description: 'Language for news generation'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - en-in
          - ta
          - hi
      retry_on_failure:
        description: 'Retry on failure (up to 3 times)'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '30 0 * * *'    # 6:00 AM IST (00:30 UTC)
    - cron: '30 12 * * *'   # 6:00 PM IST (12:30 UTC)
    - cron: '30 11 * * *'   # 5:00 PM IST (11:30 UTC)

jobs:
  run-news:
    runs-on: ubuntu-latest
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: 1  # Ensure Python output is not buffered

    steps:
      - name: Set language variable
        run: |
          if [ -z "${{ github.event.inputs.language }}" ]; then
            echo "LANGUAGE=all" >> $GITHUB_ENV
          else
            echo "LANGUAGE=${{ github.event.inputs.language }}" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Google credentials
        env:
          CLIENT_JSON: ${{ secrets.CLIENT_JSON }}
        run: |
          echo "$CLIENT_JSON" > client.json
          echo "Google credentials file created"

      - name: Restore YouTube token from secret
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_BASE64 }}" | base64 -d > youtube_token.pickle

      - name: Run Tamil news workflow
        if: env.LANGUAGE == 'all' || env.LANGUAGE == 'ta'
        run: |
          echo "Running news_video.py for Tamil"
          python news_video.py --lang ta

      - name: Run English news workflow
        if: env.LANGUAGE == 'all' || env.LANGUAGE == 'en-in'
        run: |
          echo "Running news_video.py for English"
          python news_video.py --lang en-in

      - name: Run Hindi news workflow
        if: env.LANGUAGE == 'all' || env.LANGUAGE == 'hi'
        run: |
          echo "Running news_video.py for Hindi"
          python news_video.py --lang hi

      - name: List files in workspace
        run: ls -lR

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Tamil News workflow completed successfully!"
          echo "📅 Run time: $(date)"
          echo "🔗 Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Tamil News workflow failed!"
          echo "📅 Run time: $(date)"
          echo "🔗 Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "📋 Check the logs artifact for detailed error information"

      - name: Clean up temporary files
        if: always()
        run: |
          rm -f client.json
          rm -f youtube_token.pickle
          rm -f *.wav
          rm -f "output_video*.mp4"
          echo "Cleanup completed" 
